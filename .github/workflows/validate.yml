name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kprompt-examples-ci

      - name: Apply baseline
        run: make base

      - name: Validate manifests against the API server
        run: make lint

      - name: Apply every scenario
        run: make break-all

      - name: Show namespace state
        run: make status

      - name: Tear scenarios down again
        run: make fix-all

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scenarios/*/break.sh
