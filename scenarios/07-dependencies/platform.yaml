# Suspect dependency lives outside payments so Coordinator can probe it (AG-050).
# Busybox stub that never becomes Ready — shallow probe should report notReady.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: platform
  labels:
    app: cache
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          # CrashLoop → Warning events + not-ready pods for KubeProbe evidence.
          command:
            - sh
            - -c
            - |
              echo "platform cache stub starting"
              echo "FATAL: simulated cache unavailable"
              exit 1
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["false"]
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: platform
  labels:
    app: cache
    kprompt.ai/scenario: dependencies
spec:
  selector:
    app: cache
  ports:
    - port: 6379
      targetPort: 6379
