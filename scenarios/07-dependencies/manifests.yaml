apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payments
  labels:
    app: redis
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        # Lightweight stub: memory discovery keys off the Service name "redis"
        # (and env REDIS_URL on orders). A real redis:7 image is fine when the
        # node has disk; on a crowded kind laptop it often OOMs the disk budget
        # and the demo becomes about storage instead of dependency facts.
        - name: redis
          image: busybox:1.36
          command: ["sh", "-c", "echo redis-stub listening; sleep 3600"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payments
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: payments
  labels:
    app: postgres
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        # Stub, not a real Postgres. Real postgres:16-alpine runs initdb under
        # /var/lib/postgresql/data and fails with "No space left on device" on
        # a full kind node — which then pollutes the demo with a dependency
        # CrashLoop that is unrelated to the orders→cache story.
        - name: postgres
          image: busybox:1.36
          command: ["sh", "-c", "echo postgres-stub listening; sleep 3600"]
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payments
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Consumer wired to both dependencies through env vars, and failing on a
# hostname that does not exist (the Service is "redis", not "redis-master").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: payments
  labels:
    app: orders
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          env:
            - name: REDIS_URL
              value: redis://redis-master.payments.svc.cluster.local:6379/0
            - name: DATABASE_URL
              value: postgres://payments@postgres.payments.svc.cluster.local:5432/payments
          command:
            - sh
            - -c
            - |
              echo "orders starting"
              echo "REDIS_URL=$REDIS_URL"
              sleep 2
              echo "ERROR: dial tcp: lookup redis-master.payments.svc.cluster.local: no such host"
              echo "FATAL: cache unavailable, refusing to serve"
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
