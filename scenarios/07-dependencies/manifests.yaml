apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payments
  labels:
    app: redis
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payments
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: payments
  labels:
    app: postgres
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: demo-not-a-secret
            - name: POSTGRES_DB
              value: payments
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payments
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Consumer wired to both dependencies through env vars, and failing on a
# hostname that does not exist (the Service is "redis", not "redis-master").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: payments
  labels:
    app: orders
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: dependencies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          env:
            - name: REDIS_URL
              value: redis://redis-master.payments.svc.cluster.local:6379/0
            - name: DATABASE_URL
              value: postgres://payments@postgres.payments.svc.cluster.local:5432/payments
          command:
            - sh
            - -c
            - |
              echo "orders starting"
              echo "REDIS_URL=$REDIS_URL"
              sleep 2
              echo "ERROR: dial tcp: lookup redis-master.payments.svc.cluster.local: no such host"
              echo "FATAL: cache unavailable, refusing to serve"
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
