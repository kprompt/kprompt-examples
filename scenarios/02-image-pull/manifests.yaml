apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: payments
  labels:
    app: worker
    app.kubernetes.io/part-of: kprompt-examples
    kprompt.ai/scenario: image-pull
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          # Tag intentionally does not exist -> ErrImagePull / ImagePullBackOff.
          image: ghcr.io/kprompt/kprompt-examples-does-not-exist:9.9.9
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
